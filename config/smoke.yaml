# Smoke-run overrides, merged on top of params.yaml. Every stage runs, on a small sample,
# and writes only to the -smoke repos. CI uses the same overrides.
data:
  n_days: 124               # exactly 6 months from start_date
  trades_per_day: 300
  test_sample_rows: 5000
  intercept_calibration:
    trades_per_day: 300

reference:
  n_counterparties: 120
  n_securities: 1500

regimes:
  vol_spikes:
    - {start: "2024-02-12", business_days: 12, peak: 34.0}
    - {start: "2024-06-03", business_days: 12, peak: 40.0}
  ssi_drift_start: "2024-04-01"

split:
  train_months: [1, 4]
  val_months: [5, 5]
  test_months: [6, 6]

train:
  require_gpu: false
  xgb:
    max_rounds: 300
    patience: 30
    checkpoint_every: 25

coverage:
  min_train: {failed: 1, settled: 2}
  min_eval: {failed: 0, settled: 1}
  overrides:
    H4: {settled: 0, reason: "H4 trades fail by design; smoke volume is tiny"}
    "is_period_end=1": {settled: 0, reason: "smoke validation is one month, and its month end falls in the split gap"}
  expected_regimes:
    train: [R1, R2, R3, R4, R5]
    val: [R1, R4, R5]
    test: [R1, R2, R3, R4, R5]
  min_regime_trades: 20
  min_cold_start_test_share: 0.0
  pairwise:
    min_count: 1
    allowed_empty:
      - {pair: "ssi_match_status=missing|cpty_type=corporate_treasury", reason: "two rare levels (about 2% and 0.5% of trades) at smoke volume"}
