name: keep-warm

# Free Spaces sleep after a period without visitors. A daily request keeps the demo awake.
# GitHub pauses scheduled workflows in repos without recent activity, so push a small commit
# shortly before an interview.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the Space
        run: |
          for url in https://rohanjain2312-trade-settlement-fail-predictor-demo.hf.space/ \
                     https://huggingface.co/spaces/rohanjain2312/trade-settlement-fail-predictor-demo; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || echo "000")
            echo "$url answered $code"
          done
          stage=$(curl -s https://huggingface.co/api/spaces/rohanjain2312/trade-settlement-fail-predictor-demo | python3 -c "import json,sys; print(json.load(sys.stdin).get('runtime', {}).get('stage'))")
          echo "Space stage: $stage"
          if [ "$stage" != "RUNNING" ] && [ "$stage" != "APP_STARTING" ] && [ "$stage" != "BUILDING" ]; then
            echo "::warning title=Space not running::stage is $stage"
          fi
