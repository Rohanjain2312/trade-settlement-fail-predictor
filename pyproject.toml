[project]
name = "trade-settlement-fail-predictor"
version = "0.1.0"
description = "Predicting trade settlement fails on synthetic data: logistic regression, SVM with SMOTE, XGBoost with SHAP."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B905", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end local smoke pipeline (slower)"]
addopts = "-ra"
